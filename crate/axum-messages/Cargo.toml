[package]
name = "axum-messages"
version = "0.8.0"
edition = "2024"
authors = ["Max Countryman <hello@maxcountryman.com>"]
categories = ["asynchronous", "network-programming", "web-programming"]
description = "🛎️ One-time notification messages for Axum."
homepage = "https://github.com/maxcountryman/axum-messages"
keywords = ["axum", "flash", "message", "messages", "notification"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/maxcountryman/axum-messages"
publish = false

[dependencies]
axum-core = "0.5.6"
http = "1.5.0"
parking_lot = { version = "0.13.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1"
tower = "0.5"
tower-sessions-core = "0.15.0"
tracing = { version = "0.1.44", features = ["log"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["macros"] }
http-body-util = "0.1"
hyper = "1.12"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
tower-sessions = "0.15.0"
