[package]
name = "newsletter-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
config = "0.15.27"
rand = { version = "0.10.3", features = ["std_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-aux = "4.7.0"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time", "json"] }
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.0", features = ["v7"] }
validator = "0.21.0"

[dev-dependencies]
claims = "0.8.0"
fake = "5.1.0"
linkify = "0.11.0"
proptest = "1.12.0"
rand = "0.10.3"
serde_json = "1.0.154"
wiremock = "0.6.5"
