[package]
name = "newsletter-api"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-messages = "0.8.0"
base64 = "0.23.1"
config = "0.15.27"
dotenvy = "0.15.7"
html-escape = "0.3.1"
rand = { version = "0.10.3", features = ["std_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
  "cookies",
  "form",
] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-aux = "4.7.0"
sqlx = { version = "0.9.0", default-features = false, features = [
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "uuid",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tower-sessions = { version = "0.15.0", features = ["signed"] }
tower-sessions-redis-store = "0.16.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "local-time",
  "json",
] }
unicode-segmentation = "1.13.3"
uuid = { version = "1.29.2", features = ["serde", "v7"] }
validator = "0.21.0"

[dev-dependencies]
claims = "0.8.0"
fake = "5.1.0"
linkify = "0.11.0"
proptest = "1.12.0"
rand = "0.10.3"
serde_json = "1.0.154"
wiremock = "0.6.5"

[patch.crates-io]
axum-messages = { path = "crate/axum-messages" }
tower-sessions-redis-store = { path = "crate/tower-sessions-redis-store" }
