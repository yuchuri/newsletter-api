[package]
name = "newsletter-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
config = "0.15.27"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
