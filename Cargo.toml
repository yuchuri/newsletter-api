[package]
name = "newsletter-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
config = "0.15.27"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-aux = "4.7.0"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time", "json"] }
uuid = { version = "1.29.0", features = ["v7"] }
